<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">ドンチャン・ブレイクアウトの考え方</title>
  <desc id="d">価格が直近の高値を上抜けたら買い、買った価格から一定幅下に損切りを置き、損切りか直近の安値割れで決済する。</desc>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1b2a41">買いのきっかけ・損切り・決済</text>

  <!-- grid -->
  <g stroke="#e3e8ef" stroke-width="1">
    <line x1="60" y1="70" x2="860" y2="70"/><line x1="60" y1="140" x2="860" y2="140"/>
    <line x1="60" y1="210" x2="860" y2="210"/><line x1="60" y1="280" x2="860" y2="280"/>
    <line x1="60" y1="350" x2="860" y2="350"/>
  </g>
  <line x1="60" y1="60" x2="60" y2="380" stroke="#8aa0b8"/><line x1="60" y1="380" x2="860" y2="380" stroke="#8aa0b8"/>
  <text x="460" y="408" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5b72">時間 →(4時間ごとの足)</text>
  <text x="26" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a5b72" transform="rotate(-90 26 225)">価格</text>

  <!-- channel: highest high of the previous N bars (step line) -->
  <polyline points="70,200 330,200 330,176 470,176 470,160 560,160" fill="none" stroke="#e08a00" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="80" y="188" font-family="sans-serif" font-size="14" fill="#b36b00">直前55本の「最高値」のライン</text>

  <!-- price line -->
  <polyline points="70,290 110,270 150,285 190,250 230,262 270,235 310,246 350,222 390,232 430,205 470,215 510,170 550,142 590,120 630,128 670,108 710,126 750,160 790,214 830,262"
            fill="none" stroke="#1f6feb" stroke-width="3" stroke-linejoin="round"/>

  <!-- buy -->
  <circle cx="510" cy="170" r="9" fill="#12a36b"/>
  <line x1="510" y1="160" x2="510" y2="90" stroke="#12a36b" stroke-width="2"/>
  <rect x="352" y="62" width="320" height="52" rx="8" fill="#e6f7ef" stroke="#12a36b"/>
  <text x="512" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0b6b47">① 買い</text>
  <text x="512" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0b6b47">終値が、直前55本の最高値を初めて上抜けた</text>

  <!-- stop line -->
  <line x1="510" y1="262" x2="860" y2="262" stroke="#d1344a" stroke-width="2.5" stroke-dasharray="3 4"/>
  <text x="520" y="284" font-family="sans-serif" font-size="14" fill="#a3202f">② 損切りライン(買った価格から ATR×2 だけ下)</text>
  <line x1="510" y1="170" x2="510" y2="262" stroke="#d1344a" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1344a"/></marker></defs>
  <text x="456" y="224" text-anchor="end" font-family="sans-serif" font-size="13" fill="#a3202f">この幅で、損失を</text>
  <text x="456" y="241" text-anchor="end" font-family="sans-serif" font-size="13" fill="#a3202f">あらかじめ限る</text>

  <!-- exit -->
  <circle cx="830" cy="262" r="9" fill="#7a5af8"/>
  <rect x="560" y="304" width="310" height="64" rx="8" fill="#f1edff" stroke="#7a5af8"/>
  <text x="715" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4b32b8">③ 決済</text>
  <text x="715" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b32b8">上がり続ける間は持ち続け、</text>
  <text x="715" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b32b8">損切り、または直前20本の最安値割れで売る</text>
  <line x1="830" y1="271" x2="830" y2="304" stroke="#7a5af8" stroke-width="1.5"/>

  <text x="450" y="446" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4a5b72">利益の上限(利確)は決めない。「大きな上昇を最後まで取る」ための設計です。</text>
</svg>
