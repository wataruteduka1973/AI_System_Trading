# Backend tests on Linux with a real PostgreSQL, the way CI runs them:
#   docker compose -f docker-compose.test.yml run --rm --build tests
# Other commands in the same environment, for example:
#   docker compose -f docker-compose.test.yml run --rm --build tests ruff check .
#   docker compose -f docker-compose.test.yml run --rm --build tests python -m mypy
# The database lives only on this compose network (no published port), so it never clashes
# with a PostgreSQL already running on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: worker_test
      POSTGRES_PASSWORD: worker_test
      POSTGRES_DB: worker_test_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worker_test -d worker_test_ci"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKER_TEST_DATABASE_URL: postgresql+psycopg://worker_test:worker_test@postgres:5432/worker_test_ci
