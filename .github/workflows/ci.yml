name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" -c requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check Python
        run: python -m mypy
      - name: Type check Windows launcher branches
        run: python -m mypy --platform win32
      - name: Test
        run: python -m pytest

  # Apart from `backend` on purpose: a vulnerability published tomorrow says nothing about this
  # change, and as the first step of `backend` it hid the lint, type check and tests of every pull
  # request until a dependency was updated (2026-11-07). Not a required check; the daily run in
  # security.yml is what notices new advisories.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit the locked dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit -c requirements-lock.txt
          python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip

  worker-storage:
    runs-on: ubuntu-latest
    services:
      worker-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test
          POSTGRES_DB: worker_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" -c requirements-lock.txt
      - name: Test worker storage on PostgreSQL
        env:
          WORKER_TEST_DATABASE_URL: postgresql+psycopg://worker_test:worker_test@127.0.0.1:5432/worker_test_ci
        # Selected by marker, not by file list: tests/test_postgres_marker.py fails if a
        # test module uses WORKER_TEST_DATABASE_URL without pytest.mark.postgres.
        run: python -m pytest -m postgres

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --no-git --source="/repo" --config="/repo/.gitleaks.toml" --redact --exit-code 1 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # The backend and frontend jobs above run on Linux. The app is also run on a Mac and on Windows
  # (docs/plans/cross-platform.md), where the launcher, process handling and file permissions differ.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" -c requirements-lock.txt
      - name: Test
        run: python -m pytest
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
