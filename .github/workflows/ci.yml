name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check Python
        run: python -m mypy
      - name: Type check Windows launcher branches
        run: python -m mypy --platform win32
      - name: Test
        run: python -m pytest

  worker-storage:
    runs-on: ubuntu-latest
    services:
      worker-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test
          POSTGRES_DB: worker_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test worker storage on PostgreSQL
        env:
          WORKER_TEST_DATABASE_URL: postgresql+psycopg://worker_test:worker_test@127.0.0.1:5432/worker_test_ci
        run: python -m pytest tests/test_worker_leases_postgres.py tests/test_worker_lease_contracts.py tests/test_worker_pages.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
