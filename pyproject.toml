[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-system-trading"
version = "0.1.0"
description = "AI and technical-analysis based multi-exchange trading system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "wataruteduka1973" }]
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "fastapi>=0.139,<0.142",
  "pydantic-settings>=2.14,<3",
  "psycopg[binary,pool]>=3.3.4,<4",
  "SQLAlchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.51,<0.53",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "httpx>=0.28,<1",
  "respx>=0.22,<1",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_system_trading", "app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
