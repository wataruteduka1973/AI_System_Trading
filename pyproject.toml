[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-system-trading"
version = "0.1.0"
description = "AI and technical-analysis based multi-exchange trading system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "wataruteduka1973" }]
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.139,<0.142",
  "httpx>=0.28,<1",
  "oandapyV20>=0.7.2,<1",
  "pydantic-settings>=2.14,<3",
  "psycopg[binary,pool]>=3.3.4,<4",
  "PyJWT[crypto]>=2.10,<3",
  "python-binance>=1.0.37,<2",
  "SQLAlchemy>=2.0.51,<2.1",
  "structlog>=26.1.0,<27",
  "uvicorn[standard]>=0.51,<0.53",
]
# httpx moved here from dev (Horizon5 Group A, docs/plans/horizon5-implementation-plan.md
# Unit 3.3): app/security/oidc.py's discovery/token-exchange calls are now part of the
# running application, not just test tooling.
#
# cryptography's floor is 50.0.1, not just "next available", because that's the lowest
# version that actually fixes all 4 CVEs `pip-audit` found in 46.0.7 (PYSEC-2026-3552/
# 3553/3554, GHSA-537c-gmf6-5ccf) -- one of them (PYSEC-2026-3552) is only fixed as of
# 50.0.0. Verified via `python -m pip_audit` against 50.0.1 before pinning. This
# project's only use of cryptography is Fernet symmetric encryption
# (app/services/secrets.py) -- a narrow, stable API untouched by this jump.

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "respx>=0.22,<1",
  "ruff==0.16.8",
  "mypy>=2.3,<3",
  "types-requests>=2.32,<3",
  "pip-audit>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["app", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# These installed exchange SDKs do not publish type information.
[[tool.mypy.overrides]]
module = ["binance.*", "oandapyV20.*"]
ignore_missing_imports = true
